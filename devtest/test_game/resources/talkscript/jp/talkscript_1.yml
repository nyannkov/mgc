talkscript:
  subject: "Talkscript_1"
  description: "Talkscript_1"
  talknodes:
    tower_front_talk_1:
      - { message: " * 「やあ、きみも観光かい？」", tag: POINT_1 }
      - { message: " * 「すごいよね、この塔。」" }
      - { message: " * 「思っていた以上の高さだよ。」" }
      - { message: " * 「てっぺんがかすんで見えない。」" }
      - { message: " * 「こんなに高くて大きいのに、窓やトビラがひとつもないなんて、ホント不思議だよね。」" , tag: POINT_2 }
      - { message: " * 「あんなうわさが立つのもわかるね。」" }
      - { message: " * 「あれ？ 知らない？」", tag: POINT_3 }
      - { message: " * 「実はこの塔、中にすごく恐ろしい何かが眠っているらしいよ。」" }
      - { message: " * 「うわさだと、それが起きそうになると塔にトビラがあらわれるんだって。」", tag: POINT_4 } 
      - { message: " * 「怖い話だけど、なんかちょっとワクワクするよね！」", tag: POINT_5 }
      - end: true

    tower_front_talk_2:
      - { message: " * 「・・・・・・・・・。」", tag: POINT_6 }
      - { message: " * 「え？この中に入るの？」", tag: POINT_7 }
      - end: true

    tower_front_talk_3:
      - { message: " * 「やるねぇ、君。」", end: true }

    tower_front_talk_4:
      - { message: " * 「気をつけて！」", end: true }

    shop_talk_1:
      - message: " * 「いらっしゃいませ。お客さん、初めてかな？」"
      - end: true

    shop_talk_1_2:
      - message: " * 「あら、こんにちは。」"
      - end: true
      
    shop_talk_2:
      - message: " * 「せっかくですから、ゆっくりしていってください。」"
      - message: " * 「お菓子やコーヒーもありますよ。」"
      - end: true

    shop_talk_3:
      - { message: "何をいたしましょう？", auto_next: true }
      - choice:
          tag: "SELECT_ACTION"
          items:
            - { item: "買う", next: shop_shopping }
            - { item: "休む", next: shop_coffee_break_1 }
            - { item: "話す", next: shop_small_talking_1 }
            - { item: "やめる", cancel: true }
      - end: true

    shop_shopping:
      - { message: "気になるものがあればおっしゃってください。", auto_next: true }
      - select:
          tag: SELECT_SHOPPING_CONTENT
          cases:
            - { tag: CASE_1, value: 0, next: shop_shopping_content_case_1 }
            - { tag: CASE_2, value: 1, next: shop_shopping_content_case_2 }
          default:
            next: shop_shopping_content_case_1
      - end: true
    
    shop_shopping_content_case_1:
      - choice:
          tag: "SHOPPING_CONTENT_CASE_1"
          items:
            - { item: "クッキー", value: 10, tag: COOKIE, next: shop_shopping_item_cookie }
            - { item: "ブーメラン", value: 100, tag: BOOMERANG, next: shop_shopping_item_boomerang }
            - { item: "やめる", cancel: true }
      - end: true

    shop_shopping_content_case_2:
      - choice:
          tag: "SHOPPING_CONTENT_CASE_2"
          items:
            - { item: "クッキー", value: 10, tag: COOKIE, next: shop_shopping_item_cookie }
            - { item: "ダイビング機材", value: 3000, tag: DIVING_EQUIPMENT, next: shop_shopping_item_diving_equipment }
            - { item: "やめる", cancel: true }
      - end: true

    shop_shopping_item_cookie:
      - message: "チョコチップが入ったクッキーです。"
        next: shop_shopping_check

    shop_shopping_item_boomerang:
      - message: "投げると戻ってきて、面白いですよね。"
        next: shop_shopping_check

    shop_shopping_item_diving_equipment:
      - message: "海の中でお魚と一緒に泳いでみませんか？\\nとっても楽しいですよ！"
        next: shop_shopping_check

    shop_shopping_check:
      - message: "%dGです。"
        format: true
        auto_next: true
      - choice:
          tag: "SHOPPING_CHECK"
          items:
            - { item: "買う", next: shop_shopping_judge }
            - { item: "他を見る", cancel: true, next: shop_shopping }

    shop_shopping_judge:
      - decision:
          tag: CHECK_OWNED
          branches:
            true: shop_shopping_sold_out
      - decision:
          tag: CHECK_MONEY
          branches:
            false: shop_shopping_not_enough_money

    shop_shopping_thanks:
      - message: "ありがとうございます。他になにか買いますか？"
        auto_next: true
      - choice:
          tag: "SHOPPING_IS_CONTINUE"
          items:
            - { item: "買う", next: shop_shopping }
            - { item: "やめる", cancel: true }
      - end: true
        
    shop_shopping_sold_out:
      - message: "あ、ごめんなさい。売り切れだったみたい。"
        next: shop_shopping

    shop_shopping_not_enough_money:
      - message: "あら、お金がたりないみたい。"
        next: shop_shopping

    shop_coffee_break_1:
      - { message: "コーヒーはお好きですか？" } 
      - { message: "前に焙煎した豆が余っていまして。", tag: START_COFFEE_BREAK, end: true }

    shop_coffee_break_2:
      - { message: "元気になった！", tag: END_COFFEE_BREAK, end: true }

    shop_small_talking_1:
      - choice:
          tag: "SHOP_SMALL_TALKING_1"
          items:
            - { item: "あの入口は？", next: shop_small_talking_1_1 }
            - { item: "ここは？", next: shop_small_talking_1_2 }

    shop_small_talking_1_1:
      - message: "あの入口、最近になって急に現れたんです。\\n不思議ですよね。"
      - message: "あそこをくぐれば、元の場所に戻れるそうですよ。"
      - end: true

    shop_small_talking_1_2:
      - message: "ここは私の家なんですが・・・"
      - message: "あの入口からお客さんが来てくれるようになったので、この機会にお店をはじめたんです。"
      - message: "実はずっとやってみたかったんですよ、お店屋さん。"
      - end: true

    signboard_1:
      - { message: "何かかいてある" }
      - { message: "            禍、塔の上にあり", end: true } 

    signboard_1_2:
      - { message: "何かかいてある" }
      - { message: "            WELCOME!", end: true }

    gate_1:
      - { message: "開かない・・・。", end: true }

    password_success:
      - { message: "LOAD COMPLETE!", end: true }

    password_failure:
      - { message: "LOAD ERROR!", end: true }

    password_exit:
      - { message: "タイトル画面に戻りますか？", auto_next: true }
      - choice:
          tag: "CONFIRM_PASSWORD_EXIT"
          items:
            - { item: "はい" , tag: "YES" }
            - { item: "いいえ", tag: "NO", cancel: true }
      - end: true

    game_over:
      - message: "つづける？"
      - choice:
          tag: "TRY_AGAIN"
          items:
            - { item: "はい" , tag: "YES", next: game_retry }
            - { item: "いいえ", cancel: true, tag: "NO", next: game_end }
    game_retry:
      - { message: "がんばって！", end: true }

    game_end:
      - { message: "", end: true }

    preparing:
      - { message: "準備中", end: true }

